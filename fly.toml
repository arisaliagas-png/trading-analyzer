# Fly.io configuration for trading-analyzer backend
app = "trading-analyzer-affqwq"
primary_region = "fra"   # Frankfurt — lowest latency to Greece

[build]
  context = "."
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "5000"
  AI_PROVIDER = "anthropic"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  concurrency = { type = "requests", soft_limit = 50, hard_limit = 100 }

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
